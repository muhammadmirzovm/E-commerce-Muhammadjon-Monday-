{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Update Order Status{% endblock %}
{% block content %}
<div class="container border rounded p-4 my-5 rounded-4 bg-light col-4">
<h1 class="h4 mb-3">Order #{{ object.id }} — Status</h1>
<div class="card shadow-sm border rounded-4">
 <div class="card-body">
   <form method="post">
     {% csrf_token %}
     {{ form|crispy }}
    <div class="text-center">
         <button class="btn btn-dark w-25">Save</button>
      <a class="btn btn-outline-secondary w-25" href="{% url 'seller_order_items' %}">
     Back
   </a>
    </div>
   </form>
  </div></div>
   </div>

{% endblock %}
